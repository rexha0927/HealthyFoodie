<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌿 健康吃貨 | 各週與整月統計表</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAF7F2;       
            --text-main: #5C4D43;      
            --border-color: #D5CACA;   
            --table-header: #EAE3D9;   
            --subtotal-bg: #F9E4B7;    
            --focus-border: #8FA276;
        }
        body { font-family: 'Zen Maru Gothic', "Microsoft JhengHei", sans-serif; margin: 15px 10px; background-color: var(--bg-color); color: var(--text-main); }
        .brand-header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; }
        .brand-logo { width: 58px; height: 48px; object-fit: contain; flex-shrink: 0; }
        .brand-text-group { display: flex; flex-direction: column; justify-content: center; text-align: left; }
        .brand-title { font-size: 22px; font-weight: 700; color: #436B36; margin: 0; line-height: 1.1; }
        .brand-subtitle { font-size: 11px; font-weight: 700; color: #D4A338; margin-top: 3px; }
        .title-container { text-align: center; margin-bottom: 12px; position: relative; display: flex; align-items: center; justify-content: center; min-height: 42px; }
        h3 { font-size: 18px; font-weight: 700; margin: 0; display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; background-color: #fff; border: 2px dashed var(--border-color); border-radius: 30px; box-shadow: 2px 2px 8px rgba(92, 77, 67, 0.05); }
        .home-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 20px; background-color: #fff; color: var(--text-main); font-weight: bold; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; z-index: 5; text-decoration: none; }
        .month-picker-container { text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 14px; }
        .month-picker-container input[type="month"] { font-size: 14px; padding: 5px 10px; border: 1px solid var(--border-color); border-radius: 12px; }

        .table-container { width: 100%; max-height: calc(100vh - 220px); overflow: auto; background-color: #fff; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 600px; }
        th, td { border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 8px 4px; text-align: center; font-size: 14px; white-space: nowrap; }
        thead th { position: sticky; top: 0; z-index: 10; background-color: var(--table-header); }
        .col-sticky-left { position: sticky; left: 0; z-index: 11; background-color: #fff; text-align: left; padding-left: 10px; font-weight: bold; width: 120px; }
        thead th.col-sticky-left { z-index: 20; background-color: var(--table-header); }

        .prod-info { display: flex; align-items: center; gap: 6px; }
        .col-total { background-color: var(--subtotal-bg); font-weight: bold; color: #d35400; font-size: 15px; }
        /* --- 載入中動畫 (Spinner) --- */
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(250, 247, 242, 0.85); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 6px solid #EAE3D9; border-top: 6px solid #8FA276; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #5C4D43; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">資料努力載入中...</div>
    </div>

    <div class="brand-header">
        <svg class="brand-logo" viewBox="0 0 500 360" xmlns="http://www.w3.org/2000/svg">
            <rect x="180" y="190" width="180" height="25" fill="#E8CD52"/>
            <path d="M50 60 C 50 60, 200 60, 200 210 C 200 300, 50 340, 50 340 Z" fill="#429A4C"/>
            <path d="M220 60 C 220 60, 370 60, 370 210 C 370 300, 220 340, 220 340 Z" fill="#429A4C"/>
            <path d="M390 60 C 460 60, 500 100, 500 180 L 390 180 Z" fill="#429A4C"/>
            <path d="M390 205 L 500 205 C 500 280, 460 340, 390 340 Z" fill="#E8CD52"/>
        </svg>
        <div class="brand-text-group">
            <h1 class="brand-title">健康吃貨</h1>
            <div class="brand-subtitle">HEALTHY FOODIE</div>
        </div>
    </div>

    <div class="title-container">
        <h3>📊 各週與整月統計表</h3>
        <a href="home.html" class="home-btn">🏠 首頁</a>
    </div>

    <div class="month-picker-container">
        <label for="select-month">📅 請選擇統計月份：</label>
        <input type="month" id="select-month" onchange="renderStatsTable()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="col-sticky-left">品項(單位)</th>
                    <th>第 1 週</th>
                    <th>第 2 週</th>
                    <th>第 3 週</th>
                    <th>第 4 週</th>
                    <th style="background-color: var(--subtotal-bg);">整月使用量</th>
                </tr>
            </thead>
            <tbody id="stats-tbody"></tbody>
        </table>
    </div>

    <!-- 🌟 載入全域設定檔 -->
    <script src="config.js?v=1"></script>
    <script>
        const monthInput = document.getElementById('select-month');
        const now = new Date();
        monthInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

        function formatDateYYYYMMDD(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function getWeekOfMonth(date) {
            const startOfMonth = new Date(date.getFullYear(), date.getMonth(), 1);
            let dayOfWeek = startOfMonth.getDay();
            dayOfWeek = (dayOfWeek === 0) ? 7 : dayOfWeek; 
            return Math.ceil((date.getDate() + dayOfWeek - 1) / 7);
        }

        async function renderStatsTable() {
            if (typeof WEB_APP_URL === 'undefined' || !WEB_APP_URL || WEB_APP_URL.includes("請在此貼入")) { alert("請先在 config.js 設定 WEB_APP_URL"); return; }

            document.getElementById('loading-overlay').style.display = 'flex';
            const tbody = document.getElementById('stats-tbody');
            const theadTr = document.querySelector('thead tr');
            
            const selectedYM = monthInput.value; 
            const [year, month] = selectedYM.split('-');
            const lastDayOfMonth = new Date(year, month, 0); 
            const maxWeeks = getWeekOfMonth(lastDayOfMonth); 

            let theadHtml = `<th class="col-sticky-left">品項(單位)</th>`;
            for(let w = 1; w <= maxWeeks; w++) theadHtml += `<th>第 ${w} 週</th>`;
            theadHtml += `<th style="background-color: var(--subtotal-bg);">整月使用量</th>`;
            theadTr.innerHTML = theadHtml;

            try {
                let allData;
                const cacheKey = 'inventoryDataCache';
                const cachedData = sessionStorage.getItem(cacheKey);
                
                if (cachedData) {
                    allData = JSON.parse(cachedData);
                } else {
                    const response = await fetch(WEB_APP_URL);
                    allData = await response.json();
                    sessionStorage.setItem(cacheKey, JSON.stringify(allData));
                }

                const dataMap = {};
                allData.forEach(item => {
                    const d = new Date(item.date);
                    dataMap[`${formatDateYYYYMMDD(d)}_${item.product}_${item.field}`] = parseInt(item.value, 10);
                });

                const weeklyTotals = Array(products.length).fill(0).map(() => Array(maxWeeks).fill(0));
                
                for (let day = 1; day <= lastDayOfMonth.getDate(); day++) {
                    const currentDate = new Date(year, month - 1, day);
                    const dateStr = formatDateYYYYMMDD(currentDate);
                    const weekIdx = getWeekOfMonth(currentDate) - 1; 
                    const isSunday = (currentDate.getDay() === 0);
                    
                    const nextDate = new Date(currentDate);
                    nextDate.setDate(currentDate.getDate() + 1);
                    const nextDateStr = formatDateYYYYMMDD(nextDate);

                    products.forEach((p, pIdx) => {
                        const m_stock = dataMap[`${dateStr}_${p.name}_m_stock`];
                        const m_take = dataMap[`${dateStr}_${p.name}_m_take`];
                        const a_take = dataMap[`${dateStr}_${p.name}_a_take`];
                        const remain = dataMap[`${dateStr}_${p.name}_remain`];
                        
                        if ((m_stock !== undefined) || (m_take !== undefined) || (a_take !== undefined) || (isSunday && remain !== undefined)) {
                            let minusVal = !isSunday ? (dataMap[`${nextDateStr}_${p.name}_m_stock`] || 0) : (remain || 0);
                            weeklyTotals[pIdx][weekIdx] += (m_stock || 0) + (m_take || 0) + (a_take || 0) - minusVal;
                        }
                    });
                }

                let tbodyHtml = '';
                products.forEach((p, pIdx) => {
                    let rowHtml = `<tr><td class="col-sticky-left"><div class="prod-info"><span class="prod-icon">${p.icon}</span><span class="prod-name">${p.name} <span style="font-weight:normal;">(${p.unit})</span></span></div></td>`;
                    let monthTotal = 0;
                    for (let w = 0; w < maxWeeks; w++) {
                        monthTotal += weeklyTotals[pIdx][w];
                        rowHtml += `<td>${weeklyTotals[pIdx][w]}</td>`; 
                    }
                    rowHtml += `<td class="col-total">${monthTotal}</td></tr>`; 
                    tbodyHtml += rowHtml;
                });
                tbody.innerHTML = tbodyHtml;

            } catch (error) {
                console.error("Fetch error:", error);
                tbody.innerHTML = `<tr><td colspan="10" style="padding: 20px; color: red; font-weight: bold;">❌ 讀取失敗，請檢查網路連線。</td></tr>`;
            } finally {
                setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; }, 300);
            }
        }
        renderStatsTable();
    </script>
</body>
</html>
