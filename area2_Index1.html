<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌿 健康吃貨 | 出入庫記錄表</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAF7F2;       
            --text-main: #5C4D43;      
            --border-color: #D5CACA;   
            --table-header: #EAE3D9;   
            --focus-bg: #F1F6E9;       
            --focus-border: #8FA276;   
        }
        body { font-family: 'Zen Maru Gothic', "Microsoft JhengHei", sans-serif; margin: 15px 10px; background-color: var(--bg-color); color: var(--text-main); }
        .brand-header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; }
        .brand-logo { width: 58px; height: 48px; object-fit: contain; flex-shrink: 0; }
        .brand-text-group { display: flex; flex-direction: column; justify-content: center; text-align: left; }
        .brand-title { font-size: 22px; font-weight: 700; color: #436B36; margin: 0; line-height: 1.1; }
        .brand-subtitle { font-size: 11px; font-weight: 700; color: #D4A338; margin-top: 3px; }
        .title-container { text-align: center; margin-bottom: 15px; position: relative; display: flex; align-items: center; justify-content: center; min-height: 42px; }
        h2 { font-size: 18px; font-weight: 700; margin: 0; display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; background-color: #fff; border: 2px dashed var(--border-color); border-radius: 30px; box-shadow: 2px 2px 8px rgba(92, 77, 67, 0.05); }
        .back-btn { position: absolute; left: 0; top: 50%; transform: translateY(-50%); padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 20px; background-color: #fff; font-weight: bold; font-size: 13px; cursor: pointer; display: none; align-items: center; gap: 4px; z-index: 5; }
        .home-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 20px; background-color: #fff; color: var(--text-main); font-weight: bold; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; z-index: 5; text-decoration: none; }
        .date-picker-view { max-width: 400px; margin: 30px auto; background: #fff; padding: 30px 20px; border-radius: 16px; border: 1px solid var(--border-color); text-align: center; }
        .date-picker-view input[type=date] { font-size: 16px; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; width: 80%; text-align: center; margin-bottom: 20px; }
        .date-picker-view button { padding: 10px 24px; font-size: 16px; font-weight: bold; color: #fff; background-color: #8FA276; border: none; border-radius: 20px; cursor: pointer; }
        .week-info { text-align: center; font-size: 16px; font-weight: bold; color: #7a6b60; margin-bottom: 10px; }
        .week-content { display: none; }
        .tabs-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 5px; scrollbar-width: none; }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-btn { flex-shrink: 0; padding: 7px 10px; border: none; border-radius: 20px; font-size: 15px; font-weight: bold; background-color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .tab-btn .tab-date { font-size: 11px; font-weight: normal; margin-top: 2px; }
        .tab-btn.active { color: #fff; transform: scale(1.05); }

        .day-table-container { display: none; width: 100%; max-height: calc(100vh - 240px); overflow: auto; background-color: #fff; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 80px; }
        .day-table-container.active { display: block; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 600px; }
        th, td { border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 8px 4px; text-align: center; font-size: 14px; white-space: nowrap; }
        thead th { position: sticky; top: 0; z-index: 10; background-color: var(--table-header); height: 45px; }
        .col-sticky-left { position: sticky; left: 0; z-index: 11; background-color: #fff; text-align: left; padding-left: 10px; width: 120px; font-weight: bold; }
        thead th.col-sticky-left { z-index: 20; background-color: var(--table-header); }
      
        .prod-info { display: flex; align-items: center; gap: 6px; }
        input[type=number] { width: 60px; height: 35px; border: 1px solid #eee; text-align: center; font-size: 16px; border-radius: 6px; background-color: transparent; }
        input[type=number]:focus { outline: none; border: 1px solid var(--focus-border); background-color: var(--focus-bg); }
        .th-in { background-color: #e8f8f5; color: #16a085; }
        .th-out { background-color: #fef9e7; color: #d35400; }
        
        /* 🌟 置底固定按鈕 */
        .batch-save-btn { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 350px; padding: 14px 20px; font-size: 16px; font-weight: bold; color: #fff; background-color: #d35400; border: none; border-radius: 30px; cursor: pointer; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.25); margin: 0; }
        .batch-save-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; box-shadow: none;}
        
        /* --- 載入中動畫 (Spinner) --- */
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(250, 247, 242, 0.85); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 6px solid #EAE3D9; border-top: 6px solid #8FA276; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #5C4D43; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">資料努力載入中...</div>
    </div>

    <div class="brand-header">
        <svg class="brand-logo" viewBox="0 0 500 360" xmlns="http://www.w3.org/2000/svg">
            <rect x="180" y="190" width="180" height="25" fill="#E8CD52"/>
            <path d="M50 60 C 50 60, 200 60, 200 210 C 200 300, 50 340, 50 340 Z" fill="#429A4C"/>
            <path d="M220 60 C 220 60, 370 60, 370 210 C 370 300, 220 340, 220 340 Z" fill="#429A4C"/>
            <path d="M390 60 C 460 60, 500 100, 500 180 L 390 180 Z" fill="#429A4C"/>
            <path d="M390 205 L 500 205 C 500 280, 460 340, 390 340 Z" fill="#E8CD52"/>
        </svg>
        <div class="brand-text-group">
            <h1 class="brand-title">健康吃貨</h1>
            <div class="brand-subtitle">HEALTHY FOODIE</div>
        </div>
    </div>

    <div class="title-container">
        <button class="back-btn" id="back-btn" onclick="showDatePickerView()">📅 日曆</button>
        <h2>📦 出入庫記錄表</h2>
        <a href="home.html" class="home-btn">🏠 首頁</a>
    </div>

    <div class="date-picker-view" id="date-picker-view">
        <label for="select-date">📅 請選擇欲紀錄的日期：</label>
        <input type="date" id="select-date">
        <br>
        <button onclick="confirmDateSelection()">查看當週紀錄表</button>
    </div>

    <div class="week-content" id="week-content">
        <div class="week-info" id="week-info-text"></div>
        <div class="tabs-container" id="tabs-container"></div>
        <div id="all-tables-wrapper"></div>
    </div>

    <button id="batch-save-btn" class="batch-save-btn" onclick="saveBatchData()">💾 儲存入庫記錄</button>

    <!-- 🌟 載入全域設定檔 -->
    <script src="config.js?v=1"></script>
    <script>
        const dateInput = document.getElementById('select-date');
        const todayStr = new Date().toISOString().split('T')[0];
        dateInput.value = todayStr;

        function getWeekDates(selectedDateStr) {
            const targetDate = new Date(selectedDateStr);
            const dayOfWeek = targetDate.getDay();
            const diffToMonday = (dayOfWeek === 0 ? 7 : dayOfWeek) - 1;
            const monday = new Date(targetDate);
            monday.setDate(targetDate.getDate() - diffToMonday);

            const weekDates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                weekDates.push(d);
            }
            return weekDates;
        }

        function formatDateMMDD(d) { return `${d.getMonth() + 1}/${d.getDate()}`; }
        function formatDateYYYYMMDD(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${dd}`;
        }

        async function confirmDateSelection() {
            const val = dateInput.value;
            if (!val) { alert("請先選擇日期！"); return; }

            const weekDates = getWeekDates(val);
            const selectedDate = new Date(val);
            const selectedDayIdx = (selectedDate.getDay() === 0) ? 6 : selectedDate.getDay() - 1;

            const monStr = `${weekDates[0].getFullYear()}/${weekDates[0].getMonth()+1}/${weekDates[0].getDate()}`;
            const sunStr = `${weekDates[6].getFullYear()}/${weekDates[6].getMonth()+1}/${weekDates[6].getDate()}`;
            document.getElementById('week-info-text').innerText = `🗓️ 當週區間：${monStr} ～ ${sunStr}`;

            renderWeekTables(weekDates, selectedDayIdx);

            document.getElementById('date-picker-view').style.display = 'none';
            document.getElementById('week-content').style.display = 'block';
            document.getElementById('back-btn').style.display = 'inline-flex';
            document.getElementById('batch-save-btn').style.display = 'block';

            await loadDataFromServer();
        }

        function showDatePickerView() {
            document.getElementById('date-picker-view').style.display = 'block';
            document.getElementById('week-content').style.display = 'none';
            document.getElementById('back-btn').style.display = 'none';
            document.getElementById('batch-save-btn').style.display = 'none';
        }

        function renderWeekTables(weekDates, activeIdx) {
            const tabsContainer = document.getElementById('tabs-container');
            const tablesWrapper = document.getElementById('all-tables-wrapper');

            tabsContainer.innerHTML = '';
            tablesWrapper.innerHTML = '';

            days.forEach((day, dIdx) => {
                const dateStr = formatDateMMDD(weekDates[dIdx]);
                const fullDate = formatDateYYYYMMDD(weekDates[dIdx]);
                const isActive = (dIdx === activeIdx);

                const btn = document.createElement('button');
                btn.className = `tab-btn ${isActive ? 'active' : ''}`;
                btn.innerHTML = `<span>${day.name}</span><span class="tab-date">${dateStr}</span>`;
                if(isActive) btn.style.backgroundColor = day.color; 
                btn.onclick = () => switchTab(dIdx, btn);
                tabsContainer.appendChild(btn);

                let html = `<div id="table_day_${dIdx}" class="day-table-container ${isActive ? 'active' : ''}">
                    <table>
                        <thead>
                            <tr>
                                <th class="col-sticky-left">品項(單位)</th>
                                <th class="th-in">入庫</th>
                                <th class="th-out">出庫 <span style="font-size:10px;color:#999;display:block;">(系統加總)</span></th>
                            </tr>
                        </thead>
                        <tbody>`;
                
                products.forEach((p, pIdx) => {
                    const readonlyStyle = 'readonly style="background-color: #f0f0f0; color: #d35400; font-weight: bold; cursor: not-allowed;" title="由盤點表的上午+下午拿取自動加總，不可修改"';

                    html += `
                        <tr>
                            <td class="col-sticky-left">
                                <div class="prod-info">
                                    <span class="prod-icon">${p.icon}</span>
                                    <span class="prod-name">${p.name}
                                        <span style="font-weight:normal;">(${p.unit})</span>
                                    </span>
                                </div>
                            </td>
                            <td><input type="number" id="in_${dIdx}_${pIdx}" data-date="${fullDate}" data-prod="${p.name}" data-field="in" class="inventory-input"></td>
                            <td><input type="number" id="out_${dIdx}_${pIdx}" data-date="${fullDate}" data-prod="${p.name}" data-field="out" class="inventory-input" ${readonlyStyle}></td>
                        </tr>`;
                });

                html += `</tbody></table></div>`;
                tablesWrapper.insertAdjacentHTML('beforeend', html);
            });
        }

        function switchTab(activeIndex, activeBtn) {
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach((btn) => {
                btn.classList.remove('active');
                btn.style.backgroundColor = '#fff'; 
            });
            activeBtn.classList.add('active');
            activeBtn.style.backgroundColor = days[activeIndex].color;

            const tables = document.querySelectorAll('.day-table-container');
            tables.forEach((table, index) => {
                if (index === activeIndex) table.classList.add('active');
                else table.classList.remove('active');
            });
        }

        async function loadDataFromServer() {
            if (typeof WEB_APP_URL === 'undefined' || !WEB_APP_URL || WEB_APP_URL.includes("請在此貼入")) { alert("請先在 config.js 設定 WEB_APP_URL"); return; }
            document.getElementById('loading-overlay').style.display = 'flex';

            try {
                let allData;
                const cacheKey = 'inventoryDataCache';
                const cachedData = sessionStorage.getItem(cacheKey);
                
                if (cachedData) {
                    allData = JSON.parse(cachedData);
                } else {
                    const response = await fetch(WEB_APP_URL);
                    allData = await response.json();
                    sessionStorage.setItem(cacheKey, JSON.stringify(allData));
                }

                const dataMap = {};
                allData.forEach(item => {
                    const d = new Date(item.date);
                    const dateStr = formatDateYYYYMMDD(d);
                    dataMap[`${dateStr}_${item.product}_${item.field}`] = parseInt(item.value, 10) || 0;
                });

                const allInputs = document.querySelectorAll('.inventory-input');
                allInputs.forEach(el => {
                    const dateVal = el.getAttribute('data-date');
                    const prodVal = el.getAttribute('data-prod');
                    const fieldVal = el.getAttribute('data-field');

                    if (fieldVal === 'in') {
                        const inVal = dataMap[`${dateVal}_${prodVal}_in`];
                        if (inVal !== undefined && inVal !== 0) el.value = inVal;
                        else el.value = "";
                    } else if (fieldVal === 'out') {
                        const mTake = dataMap[`${dateVal}_${prodVal}_m_take`] || 0;
                        const aTake = dataMap[`${dateVal}_${prodVal}_a_take`] || 0;
                        const totalOut = mTake + aTake;
                        if (totalOut > 0) el.value = totalOut;
                        else el.value = "";
                    }
                });
            } catch (error) {
                console.error("Load Error:", error);
                alert("資料載入失敗，請檢查網路連線 🥺");
            } finally {
                setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; }, 300);
            }
        }

        async function saveBatchData() {
            if (typeof WEB_APP_URL === 'undefined' || !WEB_APP_URL || WEB_APP_URL.includes("請在此貼入")) { alert("請先在 config.js 設定 WEB_APP_URL"); return; }

            const btn = document.getElementById('batch-save-btn');
            btn.innerText = "⏳ 儲存中...";
            btn.disabled = true;
            document.getElementById('loading-overlay').style.display = 'flex';

            const inputs = document.querySelectorAll('.inventory-input:not([readonly])');
            const dataToSave = [];

            inputs.forEach(el => {
                if (el.value.trim() !== "") {
                    dataToSave.push({
                        date: el.getAttribute('data-date'),
                        product: el.getAttribute('data-prod'),
                        field: el.getAttribute('data-field'), 
                        value: el.value
                    });
                }
            });

            if (dataToSave.length === 0) {
                alert("沒有需要儲存的入庫資料！");
                btn.innerText = "💾 儲存入庫記錄";
                btn.disabled = false;
                document.getElementById('loading-overlay').style.display = 'none';
                return;
            }

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ batchData: dataToSave })
                });

                sessionStorage.removeItem('inventoryDataCache');

                btn.innerText = "✅ 儲存成功";
                setTimeout(() => {
                    btn.innerText = "💾 儲存入庫記錄";
                    btn.disabled = false;
                }, 2000);
            } catch (error) {
                console.error("Save Error:", error);
                btn.innerText = "❌ 儲存失敗，請重試";
                setTimeout(() => {
                    btn.innerText = "💾 儲存入庫記錄";
                    btn.disabled = false;
                }, 3000);
            } finally {
                setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; }, 300);
            }
        }
    </script>
</body>
</html>
