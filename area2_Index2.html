<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌿 健康吃貨 | 出入庫統計表</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAF7F2;       
            --text-main: #5C4D43;      
            --border-color: #D5CACA;   
            --table-header: #EAE3D9;   
        }
        body { font-family: 'Zen Maru Gothic', "Microsoft JhengHei", sans-serif; margin: 15px 10px; background-color: var(--bg-color); color: var(--text-main); }
        .brand-header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; }
        .brand-logo { width: 58px; height: 48px; object-fit: contain; flex-shrink: 0; }
        .brand-text-group { display: flex; flex-direction: column; justify-content: center; text-align: left; }
        .brand-title { font-size: 22px; font-weight: 700; color: #436B36; margin: 0; line-height: 1.1; }
        .brand-subtitle { font-size: 11px; font-weight: 700; color: #D4A338; margin-top: 3px; }
        .title-container { text-align: center; margin-bottom: 12px; position: relative; display: flex; align-items: center; justify-content: center; min-height: 42px; }
        h2 { font-size: 18px; font-weight: 700; margin: 0; display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; background-color: #fff; border: 2px dashed var(--border-color); border-radius: 30px; box-shadow: 2px 2px 8px rgba(92, 77, 67, 0.05); }
        .home-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 20px; background-color: #fff; color: var(--text-main); font-weight: bold; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; z-index: 5; text-decoration: none; }
        .month-picker-container { text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 14px; }
        .month-picker-container input[type="date"] { font-size: 14px; padding: 5px 10px; border: 1px solid var(--border-color); border-radius: 12px; }

        .table-container { width: 100%; max-height: calc(100vh - 240px); overflow: auto; background-color: #fff; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 80px; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 600px;}
        th, td { border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 8px 6px; text-align: center; font-size: 13.5px; white-space: nowrap; }
        thead th { position: sticky; top: 0; z-index: 10; background-color: var(--table-header); }
        .col-sticky-left { position: sticky; left: 0; z-index: 11; background-color: #fff; text-align: left; padding-left: 12px; font-weight: bold; width: 120px; }
        thead th.col-sticky-left { z-index: 20; background-color: var(--table-header); }

        .prod-info { display: flex; align-items: center; gap: 6px; }
        input[type=number] { width: 55px; height: 32px; border: 1px solid #eee; text-align: center; font-size: 14px; border-radius: 6px; background-color: transparent; }
        input[readonly] { background-color: #f0f0f0; cursor: not-allowed; }
        .status-normal { color: #27ae60; font-weight: bold; }
        .status-warning { color: #e74c3c; font-weight: bold; background-color: #fadbd8; padding: 2px 8px; border-radius: 10px; }
        .bg-calc { background-color: #fcf8e3; font-weight: bold; }
        
        /* 🌟 置底固定按鈕 */
        .batch-save-btn { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 350px; padding: 14px 20px; font-size: 16px; font-weight: bold; color: #fff; background-color: #d35400; border: none; border-radius: 30px; cursor: pointer; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.25); margin: 0; }
        .batch-save-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; box-shadow: none; }

        /* --- 載入中動畫 (Spinner) --- */
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(250, 247, 242, 0.85); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 6px solid #EAE3D9; border-top: 6px solid #8FA276; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #5C4D43; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">資料努力載入中...</div>
    </div>

    <div class="brand-header">
        <svg class="brand-logo" viewBox="0 0 500 360" xmlns="http://www.w3.org/2000/svg">
            <rect x="180" y="190" width="180" height="25" fill="#E8CD52"/>
            <path d="M50 60 C 50 60, 200 60, 200 210 C 200 300, 50 340, 50 340 Z" fill="#429A4C"/>
            <path d="M220 60 C 220 60, 370 60, 370 210 C 370 300, 220 340, 220 340 Z" fill="#429A4C"/>
            <path d="M390 60 C 460 60, 500 100, 500 180 L 390 180 Z" fill="#429A4C"/>
            <path d="M390 205 L 500 205 C 500 280, 460 340, 390 340 Z" fill="#E8CD52"/>
        </svg>
        <div class="brand-text-group">
            <h1 class="brand-title">健康吃貨</h1>
            <div class="brand-subtitle">HEALTHY FOODIE</div>
        </div>
    </div>

    <div class="title-container">
        <h2 id="page-title">📊 出入庫統計表</h2>
        <a href="home.html" class="home-btn">🏠 首頁</a>
    </div>

    <div class="month-picker-container">
        <label for="select-date">📅 請選擇統計日期：</label>
        <input type="date" id="select-date">
        <div id="week-info-text" style="margin-top: 8px; color: #7a6b60;"></div>
    </div>

    <div class="table-container">
        <table id="stats-table">
            <thead>
                <tr>
                    <th class="col-sticky-left">品項(單位)</th>
                    <th>上週庫存<br><span style="font-size:10px;color:#999;">(歷史加總)</span></th>
                    <th>本週入庫</th>
                    <th>本週出庫</th>
                    <th class="bg-calc">剩餘數量</th>
                    <th>安全庫存</th>
                    <th>庫存狀態</th>
                </tr>
            </thead>
            <tbody id="stats-tbody"></tbody>
        </table>
    </div>

    <button id="save-safe-btn" class="batch-save-btn" onclick="saveSafeStock()">💾 儲存安全庫存設定</button>

    <!-- 🌟 載入全域設定檔 -->
    <script src="config.js"></script>
    <script>
        const dateInput = document.getElementById('select-date');
        const todayStr = new Date().toISOString().split('T')[0];
        dateInput.value = todayStr;

        let globalSafeStockMap = {}; // 存放從雲端抓下來的最新安全庫存設定

        function formatDateYYYYMMDD(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${dd}`;
        }

        async function renderTable() {
            const val = dateInput.value;
            if (!val) return;

            const targetDate = new Date(val);
            const dayOfWeek = targetDate.getDay();
            const diffToMonday = (dayOfWeek === 0 ? 7 : dayOfWeek) - 1;
            const monday = new Date(targetDate);
            monday.setDate(targetDate.getDate() - diffToMonday);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);

            const monStr = formatDateYYYYMMDD(monday);
            const sunStr = formatDateYYYYMMDD(sunday);

            document.getElementById('week-info-text').innerText = `🗓️ 統計區間：${monday.getFullYear()}/${String(monday.getMonth()+1).padStart(2, '0')}/${String(monday.getDate()).padStart(2, '0')} ～ ${sunday.getFullYear()}/${String(sunday.getMonth()+1).padStart(2, '0')}/${String(sunday.getDate()).padStart(2, '0')}`;

            const tbody = document.getElementById('stats-tbody');
            document.getElementById('save-safe-btn').style.display = 'none'; // 載入完成前先隱藏存檔按鈕

            if (typeof WEB_APP_URL === 'undefined' || !WEB_APP_URL || WEB_APP_URL.includes("請在此貼入")) {
                tbody.innerHTML = '<tr><td colspan="7" style="padding: 20px; color: red;">請先在 config.js 設定 WEB_APP_URL！</td></tr>';
                return;
            }

            document.getElementById('loading-overlay').style.display = 'flex';

            try {
                let allData;
                const cacheKey = 'inventoryDataCache';
                const cachedData = sessionStorage.getItem(cacheKey);
                
                if (cachedData) {
                    allData = JSON.parse(cachedData);
                } else {
                    const response = await fetch(WEB_APP_URL);
                    allData = await response.json();
                    sessionStorage.setItem(cacheKey, JSON.stringify(allData));
                }

                let prevStockSum = new Array(products.length).fill(0);
                let weeklyInSum = new Array(products.length).fill(0);
                let weeklyOutSum = new Array(products.length).fill(0);
                globalSafeStockMap = {}; // 每次重繪前清空本地地圖

                allData.forEach(item => {
                    // 🌟 攔截並記錄最新的一筆安全庫存設定
                    if (item.field === 'safe_stock') {
                        globalSafeStockMap[item.product] = parseInt(item.value, 10);
                        return; // 不參與後續的進出庫數量計算
                    }

                    const d = new Date(item.date);
                    const itemDateStr = formatDateYYYYMMDD(d);
                    
                    const pIdx = products.findIndex(p => p.name === item.product);
                    if (pIdx !== -1) {
                        const val = parseInt(item.value, 10) || 0;
                        
                        if (itemDateStr < monStr) {
                            if (item.field === 'in') prevStockSum[pIdx] += val;
                            else if (item.field === 'm_take' || item.field === 'a_take') prevStockSum[pIdx] -= val;
                        } else if (itemDateStr >= monStr && itemDateStr <= sunStr) {
                            if (item.field === 'in') weeklyInSum[pIdx] += val;
                            else if (item.field === 'm_take' || item.field === 'a_take') weeklyOutSum[pIdx] += val;
                        }
                    }
                });

                let tbodyHtml = '';
                products.forEach((p, pIdx) => {
                    // 🌟 判斷：雲端有設定就用雲端的，沒有就用 config.js 的預設值
                    const currentSafeStock = globalSafeStockMap[p.name] !== undefined ? globalSafeStockMap[p.name] : p.safe;

                    tbodyHtml += `<tr>
                        <td class="col-sticky-left">
                            <div class="prod-info"><span class="prod-icon">${p.icon}</span><span>${p.name} <span style="font-weight:normal;">(${p.unit})</span></span></div>
                        </td>
                        <td><input type="number" id="prev_stock_${pIdx}" value="${prevStockSum[pIdx]}" readonly style="background-color: #f0f0f0; color: #888;" title="系統自動計算歷史結餘，不可修改"></td>
                        <td><input type="number" id="in_stock_${pIdx}" value="${weeklyInSum[pIdx]}" readonly style="background-color: #f0f0f0;"></td>
                        <td><input type="number" id="out_stock_${pIdx}" value="${weeklyOutSum[pIdx]}" readonly style="background-color: #f0f0f0;"></td>
                        <td class="bg-calc" id="remain_stock_${pIdx}">100</td>
                        <td><input type="number" id="safe_stock_${pIdx}" value="${currentSafeStock}" oninput="calculateRow(${pIdx})"></td>
                        <td id="status_${pIdx}" class="status-normal">✅ 正常</td>
                    </tr>`;
                });

                tbody.innerHTML = tbodyHtml;
                products.forEach((_, pIdx) => calculateRow(pIdx));
                document.getElementById('save-safe-btn').style.display = 'block'; // 顯示存檔按鈕

            } catch (error) {
                console.error("Load Error:", error);
                tbody.innerHTML = '<tr><td colspan="7" style="padding: 20px; color: red;">❌ 資料讀取失敗</td></tr>';
            } finally {
                setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; }, 300);
            }
        }

        function calculateRow(pIdx) {
            const prevStock = parseInt(document.getElementById(`prev_stock_${pIdx}`).value) || 0;
            const inStock = parseInt(document.getElementById(`in_stock_${pIdx}`).value) || 0;
            const outStock = parseInt(document.getElementById(`out_stock_${pIdx}`).value) || 0;
            const remain = prevStock + inStock - outStock;
            const safeStock = parseInt(document.getElementById(`safe_stock_${pIdx}`).value) || 0;

            document.getElementById(`remain_stock_${pIdx}`).innerText = remain;
            const statusTd = document.getElementById(`status_${pIdx}`);
            if (remain < safeStock) {
                statusTd.className = 'status-warning';
                statusTd.innerText = '⚠️ 補貨';
            } else {
                statusTd.className = 'status-normal';
                statusTd.innerText = '✅ 正常';
            }
        }

        async function saveSafeStock() {
            if (typeof WEB_APP_URL === 'undefined' || !WEB_APP_URL || WEB_APP_URL.includes("請在此貼入")) { alert("請先在 config.js 設定 WEB_APP_URL"); return; }

            const btn = document.getElementById('save-safe-btn');
            btn.innerText = "⏳ 儲存中...";
            btn.disabled = true;
            document.getElementById('loading-overlay').style.display = 'flex';

            const dataToSave = [];
            const todayStr = new Date().toISOString().split('T')[0];

            products.forEach((p, pIdx) => {
                const inputEl = document.getElementById(`safe_stock_${pIdx}`);
                if (inputEl) {
                    const val = parseInt(inputEl.value, 10) || 0;
                    const prevVal = globalSafeStockMap[p.name] !== undefined ? globalSafeStockMap[p.name] : p.safe;
                    
                    // 如果畫面上的值跟原本紀錄的值不一樣，才需要存檔
                    if (val !== prevVal) {
                        dataToSave.push({
                            date: todayStr,
                            product: p.name,
                            field: 'safe_stock',
                            value: val
                        });
                    }
                }
            });

            if (dataToSave.length === 0) {
                alert("沒有修改任何安全庫存設定！");
                btn.innerText = "💾 儲存安全庫存設定";
                btn.disabled = false;
                document.getElementById('loading-overlay').style.display = 'none';
                return;
            }

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ batchData: dataToSave })
                });

                // 存檔成功後一定要清掉快取，這樣重整才會抓到新資料
                sessionStorage.removeItem('inventoryDataCache');

                // 同步更新本地變數，避免重複存檔
                dataToSave.forEach(d => {
                    globalSafeStockMap[d.product] = d.value;
                });

                btn.innerText = "✅ 儲存成功";
                setTimeout(() => {
                    btn.innerText = "💾 儲存安全庫存設定";
                    btn.disabled = false;
                }, 2000);
            } catch (error) {
                console.error("Save Error:", error);
                btn.innerText = "❌ 儲存失敗，請重試";
                setTimeout(() => {
                    btn.innerText = "💾 儲存安全庫存設定";
                    btn.disabled = false;
                }, 3000);
            } finally {
                setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; }, 300);
            }
        }

        document.getElementById('select-date').addEventListener('change', renderTable);
        renderTable();
    </script>
</body>
</html>
